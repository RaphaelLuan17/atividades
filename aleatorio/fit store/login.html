<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Academia Fit Store</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="topo">

        <a href="index.html" class="marca">

            <div class="logo">
                <img src="img/logo.png" alt="Academia Fit Store">
            </div>

            <span>Academia Fit Store</span>

        </a>

        <nav class="menu">

            <a href="index.html">Home</a>
            <a href="produtos.html">Produtos</a>
            <a href="contato.html">Sobre / Contato</a>
            <a href="login.html">Login</a>

        </nav>

    </header>


    <main>

        <section class="login-area">

            <div class="login-card">

                <span class="subtitulo">
                    Academia Fit Store
                </span>

                <h1>
                    Entrar
                </h1>

                <p>
                    Acesse sua conta para continuar.
                </p>


                <form id="loginForm">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                    >


                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >


                    <button
                        type="submit"
                        class="botao"
                    >
                        Entrar
                    </button>

                </form>


                <div class="login-links">

                    <a href="#">
                        Esqueci minha senha
                    </a>

                    <a href="#">
                        Criar uma conta
                    </a>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 Academia Fit Store.
            Todos os direitos reservados.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
